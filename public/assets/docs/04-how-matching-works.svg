<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">How SPOTS matches a login to REDCap</title>
  <desc id="desc">Sign-in email comes from UTHealth AWS Cognito, then REDCap is checked on email_primary or spots_user_id.</desc>
  <rect width="920" height="720" fill="#f4f7fb"/>
  <rect x="24" y="24" width="872" height="672" rx="16" fill="#ffffff" stroke="#d5deea"/>

  <text x="52" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#065395">4) How login matching works</text>
  <text x="52" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4a627a">Where the email comes from, and what REDCap fields are checked</text>

  <rect x="52" y="140" width="240" height="88" rx="12" fill="#065395"/>
  <text x="172" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1. Sign in</text>
  <text x="172" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d7e8f8">Google or password</text>

  <path d="M302 184 L338 184" stroke="#065395" stroke-width="3"/>
  <path d="M328 174 L344 184 L328 194" fill="#065395"/>

  <rect x="348" y="140" width="240" height="88" rx="12" fill="#1a6fad"/>
  <text x="468" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2. Cognito email</text>
  <text x="468" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d7e8f8">UTHealth AWS Cognito</text>
  <text x="468" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d7e8f8">(spotsymptoms.org auth)</text>

  <path d="M598 184 L634 184" stroke="#065395" stroke-width="3"/>
  <path d="M624 174 L640 184 L624 194" fill="#065395"/>

  <rect x="644" y="140" width="220" height="88" rx="12" fill="#1f6b3a"/>
  <text x="754" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3. Check REDCap</text>
  <text x="754" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e3f5ea">match that email</text>

  <rect x="52" y="268" width="812" height="150" rx="12" fill="#e8eef5" stroke="#9bb8d6"/>
  <text x="76" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#12304f">REDCap looks for a person where either field matches:</text>
  <text x="76" y="344" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#065395">email_primary</text>
  <text x="280" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4a627a">usual family / parent email</text>
  <text x="76" y="380" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#065395">spots_user_id</text>
  <text x="280" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4a627a">only if staff put an email there (child alone case)</text>

  <rect x="52" y="450" width="390" height="140" rx="12" fill="#eaf6ef" stroke="#8fbf9a"/>
  <text x="72" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6b3a">If 2 people match</text>
  <text x="72" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">Show Reporting as screen</text>
  <text x="72" y="544" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">User picks Parent or Child</text>
  <text x="72" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">(shared email_primary)</text>

  <rect x="474" y="450" width="390" height="140" rx="12" fill="#eef4fb" stroke="#9bb8d6"/>
  <text x="494" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#065395">If 1 person matches</text>
  <text x="494" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">Go straight into that account</text>
  <text x="494" y="544" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">No profile picker</text>
  <text x="494" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">(single row or child-own email)</text>

  <rect x="52" y="620" width="812" height="48" rx="10" fill="#fff3d6" stroke="#d4a017"/>
  <text x="76" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">No separate Cognito email field in REDCap - Cognito only supplies the signed-in email.</text>
</svg>
