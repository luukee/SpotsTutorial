<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
  <title id="title">Child logs in alone with their own email</title>
  <desc id="desc">Parent email stays on email_primary. Child email goes in spots_user_id so the child can sign in alone.</desc>
  <rect width="920" height="760" fill="#f4f7fb"/>
  <rect x="24" y="24" width="872" height="712" rx="16" fill="#ffffff" stroke="#d5deea"/>

  <text x="52" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#065395">3) Child logs in alone with their own email</text>
  <text x="52" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4a627a">Keep parent email on email_primary. Put the child email in spots_user_id.</text>

  <text x="52" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#12304f">REDCap setup</text>

  <rect x="52" y="166" width="380" height="120" rx="12" fill="#e8eef5" stroke="#9bb8d6"/>
  <text x="72" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#12304f">Parent row</text>
  <text x="72" y="228" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#12304f">email_primary: parent@email.com</text>
  <text x="72" y="254" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#4a627a">spots_user_id: parent_id</text>

  <rect x="468" y="166" width="380" height="120" rx="12" fill="#fff3d6" stroke="#d4a017"/>
  <text x="488" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a6a12">Child row (key difference)</text>
  <text x="488" y="228" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#12304f">email_primary: parent@email.com</text>
  <text x="488" y="254" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#8a6a12">spots_user_id: kid@gmail.com</text>

  <text x="52" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#12304f">What happens at login</text>

  <rect x="52" y="348" width="380" height="200" rx="12" fill="#eef4fb" stroke="#9bb8d6"/>
  <text x="72" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#065395">If they sign in as parent@email.com</text>
  <text x="72" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">Matches both parent + child</text>
  <text x="72" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">(shared email_primary)</text>
  <rect x="72" y="464" width="340" height="48" rx="8" fill="#fff3d6" stroke="#d4a017"/>
  <text x="242" y="494" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a6a12">Reporting as - pick who</text>

  <rect x="468" y="348" width="380" height="200" rx="12" fill="#eaf6ef" stroke="#8fbf9a"/>
  <text x="488" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6b3a">If they sign in as kid@gmail.com</text>
  <text x="488" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">Matches child spots_user_id only</text>
  <text x="488" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">(Google or password OK)</text>
  <rect x="488" y="464" width="340" height="48" rx="8" fill="#1f6b3a"/>
  <text x="658" y="494" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Straight in as child</text>

  <rect x="52" y="580" width="812" height="120" rx="12" fill="#e8eef5" stroke="#9bb8d6"/>
  <text x="76" y="616" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#065395">Automated emails still go to parent@email.com</text>
  <text x="76" y="646" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">Because email_primary stays the parent email on both rows.</text>
  <text x="76" y="674" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#12304f">Prefer lowercase for the child spots_user_id email.</text>
</svg>
